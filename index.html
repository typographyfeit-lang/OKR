<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131f">
  <meta name="description" content="OKR Daily — личная система целей, решений и фокуса">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OKR Daily">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>OKR Daily 3</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Основное меню">
      <div class="brand"><span class="brand-symbol">◈</span><span>OKR <strong>Daily</strong><small>STRATEGY OS</small></span></div>
      <div class="sidebar-heading">РАБОЧЕЕ ПРОСТРАНСТВО</div>
      <nav id="desktop-nav" class="nav-items" aria-label="Навигация"></nav>
      <div class="sidebar-bottom"><span class="live-dot"></span> Локальный режим <small>v3</small></div>
    </aside>
    <div class="work-area">
      <header class="topbar">
        <div class="topbar-name"><span class="mobile-mark">◈</span><div><strong id="page-name">Сегодня</strong><small id="page-subtitle">Место для действий с максимальным эффектом</small></div></div>
        <div class="topbar-actions"><button type="button" class="icon-btn" data-action="toggle-theme" aria-label="Переключить тему" title="Тема">◐</button><button type="button" class="icon-btn" data-action="open-notices" aria-label="Напоминания" title="Напоминания">♧<i id="notice-dot"></i></button></div>
      </header>
      <main id="app" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Основная навигация"></nav>
  <dialog id="modal" class="modal"><div id="modal-inner"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="app.js"></script>
  <script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
